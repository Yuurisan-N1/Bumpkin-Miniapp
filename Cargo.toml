[package]
name = "bumpkin-legends-bot"
version = "0.1.0"
edition = "2021"
description = "Bumpkin Legends Miniapp automation bot (WebSocket stateful client)"
license = "MIT"

[[bin]]
name = "bumpkin-legends-bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect", "handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
chrono = "0.4"
reqwest = { version = "0.11", features = ["socks", "rustls-tls", "json", "gzip"], default-features = false }
rand = "0.8"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
